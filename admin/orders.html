<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orders | Mixler Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="admin-body">
  <div class="admin-layout">
    <div class="admin-mobile-header">
      <a href="/"><img src="/images/mixler-white-wide.png" alt="Mixler" class="nav-logo-img"></a>
      <button class="admin-menu-btn" id="admin-menu-toggle">&#9776;</button>
    </div>
    <div class="admin-sidebar-overlay" id="sidebar-overlay"></div>
    <aside class="admin-sidebar" id="admin-sidebar">
      <a href="/" class="nav-logo" style="padding:24px;"><img src="/images/mixler-white-wide.png" alt="Mixler" class="nav-logo-img"></a>
      <nav class="admin-nav">
        <a href="/admin/" class="admin-nav-link">Dashboard</a>
        <a href="/admin/events.html" class="admin-nav-link">Events</a>
        <a href="/admin/orders.html" class="admin-nav-link active">Orders</a>
        <a href="/admin/coupons.html" class="admin-nav-link">Coupons</a>
        <a href="/admin/customers.html" class="admin-nav-link">Customers</a>
        <a href="/admin/messages.html" class="admin-nav-link">Messages</a>
        <a href="/admin/scan.html" class="admin-nav-link">Scan</a>
      </nav>
      <div class="admin-sidebar-footer">
        <a href="/" class="admin-nav-link">Back to Site</a>
        <a href="#" id="admin-logout" class="admin-nav-link">Log Out</a>
      </div>
    </aside>

    <main class="admin-main">
      <div class="admin-header">
        <h1>Orders</h1>
        <div style="display:flex;gap:8px;">
          <button id="create-manual-order" class="btn btn-primary">Create Manual Order</button>
          <button id="export-csv" class="btn btn-pink">Export CSV</button>
        </div>
      </div>

      <!-- Filters -->
      <div class="admin-card admin-filters-card">
        <div class="admin-form admin-filters-form">
          <div class="form-group">
            <label for="filter-event">Event</label>
            <select id="filter-event">
              <option value="">All Events</option>
            </select>
          </div>
          <div class="form-group">
            <label for="filter-status">Status</label>
            <select id="filter-status">
              <option value="">All</option>
              <option value="completed">Completed</option>
              <option value="pending">Pending</option>
              <option value="failed">Failed</option>
              <option value="refunded">Refunded</option>
            </select>
          </div>
          <div class="form-group">
            <label for="filter-search">Search</label>
            <input type="text" id="filter-search" placeholder="Name, email, or order #">
          </div>
          <button type="button" id="filter-btn" class="btn btn-primary">Filter</button>
        </div>
      </div>

      <!-- Stats -->
      <div class="admin-stats" id="order-stats">
        <div class="stat-card">
          <div class="stat-card-label">Total Orders</div>
          <div class="stat-card-value" id="stat-count">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-card-label">Revenue</div>
          <div class="stat-card-value" id="stat-revenue">$0.00</div>
        </div>
        <div class="stat-card">
          <div class="stat-card-label">Tickets</div>
          <div class="stat-card-value" id="stat-tickets">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-card-label">Refunds</div>
          <div class="stat-card-value" id="stat-refunds">$0.00</div>
        </div>
      </div>

      <!-- Orders Table -->
      <div class="admin-card">
        <div id="orders-list">
          <div class="loading-spinner"><div class="spinner"></div></div>
        </div>
      </div>

      <!-- Order Detail Modal -->
      <div id="order-modal" class="admin-modal" style="display:none;">
        <div class="admin-modal-content">
          <div class="admin-modal-header">
            <h3 id="modal-title">Order Details</h3>
            <button class="modal-close" id="modal-close">&times;</button>
          </div>
          <div id="modal-body"></div>
        </div>
      </div>

      <!-- Create Manual Order Modal -->
      <div id="manual-order-modal" class="admin-modal" style="display:none;">
        <div class="admin-modal-content" style="max-width:760px;">
          <div class="admin-modal-header">
            <h3>Create Manual Order</h3>
            <button class="modal-close" id="manual-order-close">&times;</button>
          </div>
          <div id="manual-order-body"></div>
        </div>
      </div>
    </main>
  </div>

  <script type="module">
    import { requireAdmin, signOut } from '../js/auth.js';
    import { db, SUPABASE_URL, SUPABASE_ANON_KEY } from '../js/supabase-client.js';
    import { formatPrice, formatDate, getParam } from '../js/utils.js';
    import { showToast } from '../js/components.js';

    await requireAdmin();

    document.getElementById('admin-logout').addEventListener('click', async (e) => {
      e.preventDefault();
      await signOut();
    });

    // Create Manual Order modal open/close
    const manualModal = document.getElementById('manual-order-modal');
    const manualBody = document.getElementById('manual-order-body');
    document.getElementById('create-manual-order').addEventListener('click', () => {
      renderManualOrderForm();
      manualModal.style.display = 'flex';
    });
    document.getElementById('manual-order-close').addEventListener('click', () => {
      manualModal.style.display = 'none';
    });
    manualModal.addEventListener('click', (e) => {
      if (e.target === manualModal) manualModal.style.display = 'none';
    });

    // Manual order form state
    const manualOrderState = {
      event: null,
      ticketType: null,
      quantity: 1,
      pricePerTicketDollars: 0,
      buyer: { name: '', email: '', phone: '' },
      attendees: [{ full_name: '', email: '', phone: '' }],
      sendBuyerEmail: true,
      sendAttendeeEmails: true,
    };

    function renderManualOrderForm() {
      manualBody.innerHTML = `
        <form id="manual-order-form" class="admin-form" onsubmit="return false">
          <div class="form-group">
            <label>Event</label>
            <select id="mo-event" required>
              <option value="">Select an event...</option>
              ${(events || []).filter(e => e.status !== 'draft').map(e =>
                `<option value="${e.id}">${e.title} (${e.event_date})</option>`
              ).join('')}
            </select>
          </div>

          <div class="form-group">
            <label>Ticket type</label>
            <select id="mo-ticket-type" required disabled>
              <option value="">Select an event first</option>
            </select>
          </div>

          <div class="form-group">
            <label>Quantity</label>
            <input type="number" id="mo-quantity" min="1" value="1" required>
          </div>

          <div class="form-group">
            <label>Price per ticket (CAD)</label>
            <input type="number" id="mo-price" min="0" step="0.01" value="0" required>
            <small id="mo-price-hint" style="color:#6b7280;"></small>
          </div>

          <div class="form-group">
            <label style="display:flex;align-items:center;gap:8px;">
              <input type="checkbox" id="mo-send-buyer-email" checked>
              Send confirmation email to buyer
            </label>
            <label style="display:flex;align-items:center;gap:8px;margin-top:6px;">
              <input type="checkbox" id="mo-send-attendee-emails" checked>
              Send ticket email to each attendee (with PDF)
            </label>
          </div>

          <fieldset style="border:1px solid #e5e7eb;padding:12px;border-radius:8px;margin-top:12px;">
            <legend style="padding:0 6px;font-weight:600;">Buyer</legend>
            <div id="mo-buyer-picker-wrap">
              <div class="form-group">
                <label>Search past customers</label>
                <input type="text" id="mo-buyer-search" placeholder="Start typing a name or email...">
                <div id="mo-buyer-suggestions" style="display:none;border:1px solid #e5e7eb;border-radius:6px;margin-top:4px;max-height:200px;overflow-y:auto;"></div>
              </div>
              <button type="button" id="mo-buyer-new" class="btn btn-sm">Or enter a new customer</button>
            </div>
            <div id="mo-buyer-fields" style="margin-top:8px;">
              <div class="form-group">
                <label>Name</label>
                <input type="text" id="mo-buyer-name" required>
              </div>
              <div class="form-group">
                <label>Email</label>
                <input type="email" id="mo-buyer-email" required>
              </div>
              <div class="form-group">
                <label>Phone (optional)</label>
                <input type="tel" id="mo-buyer-phone">
              </div>
            </div>
          </fieldset>

          <fieldset style="border:1px solid #e5e7eb;padding:12px;border-radius:8px;margin-top:12px;">
            <legend style="padding:0 6px;font-weight:600;">Attendees</legend>
            <div id="mo-attendees-list"></div>
          </fieldset>

          <div id="mo-summary" style="background:#f9fafb;padding:12px;border-radius:8px;margin-top:12px;">
            <div style="display:flex;justify-content:space-between;"><span>Subtotal</span><span id="mo-sum-subtotal">$0.00</span></div>
            <div style="display:flex;justify-content:space-between;"><span>GST (5%)</span><span id="mo-sum-tax">$0.00</span></div>
            <div style="display:flex;justify-content:space-between;font-weight:700;border-top:1px solid #e5e7eb;margin-top:6px;padding-top:6px;"><span>Total</span><span id="mo-sum-total">$0.00</span></div>
          </div>

          <div id="mo-error" class="form-error" style="display:none;margin-top:8px;"></div>

          <button type="submit" id="mo-submit" class="btn btn-primary" style="margin-top:12px;width:100%;">Create Order</button>
        </form>
      `;

      bindManualOrderHandlers();
    }

    function bindManualOrderHandlers() {
      const $ = (id) => document.getElementById(id);
      const eventSel = $('mo-event');
      const ttSel = $('mo-ticket-type');
      const qtyInput = $('mo-quantity');
      const priceInput = $('mo-price');
      const priceHint = $('mo-price-hint');
      const attendeesList = $('mo-attendees-list');
      const buyerName = $('mo-buyer-name');
      const buyerEmail = $('mo-buyer-email');
      const buyerPhone = $('mo-buyer-phone');

      async function onEventChange() {
        const eventId = eventSel.value;
        manualOrderState.event = (events || []).find(e => e.id === eventId) || null;
        ttSel.innerHTML = '<option value="">Loading...</option>';
        ttSel.disabled = true;
        manualOrderState.ticketType = null;
        if (!eventId) {
          ttSel.innerHTML = '<option value="">Select an event first</option>';
          updateSummary();
          return;
        }
        const { data: tts, error } = await db
          .from('ticket_types')
          .select('id, name, price_cents, capacity, tickets_sold, is_active')
          .eq('event_id', eventId)
          .eq('is_active', true)
          .order('sort_order');
        if (error || !tts || tts.length === 0) {
          ttSel.innerHTML = '<option value="">No active ticket types</option>';
          return;
        }
        ttSel.innerHTML = tts.map(tt => `<option value="${tt.id}">${tt.name} ($${(tt.price_cents/100).toFixed(2)})</option>`).join('');
        ttSel.disabled = false;
        ttSel.value = tts[0].id;
        manualOrderState._ticketTypes = tts;
        onTicketTypeChange();
      }

      function onTicketTypeChange() {
        const ttId = ttSel.value;
        const tt = (manualOrderState._ticketTypes || []).find(t => t.id === ttId) || null;
        manualOrderState.ticketType = tt;
        if (tt) {
          priceInput.value = (tt.price_cents / 100).toFixed(2);
          manualOrderState.pricePerTicketDollars = tt.price_cents / 100;
        }
        updatePriceHint();
        if (manualOrderState.event) {
          qtyInput.max = manualOrderState.event.max_tickets_per_order || 10;
        }
        updateAttendees();
        updateSummary();
      }

      function updatePriceHint() {
        const price = parseFloat(priceInput.value) || 0;
        manualOrderState.pricePerTicketDollars = price;
        if (price === 0) {
          priceHint.textContent = 'Comp ticket (free)';
          priceHint.style.color = '#153db6';
        } else {
          priceHint.textContent = 'E-transfer order (customer pays via e-transfer)';
          priceHint.style.color = '#6b7280';
        }
        updateSummary();
      }

      function onQuantityChange() {
        const q = Math.max(1, parseInt(qtyInput.value, 10) || 1);
        qtyInput.value = q;
        manualOrderState.quantity = q;
        updateAttendees();
        updateSummary();
      }

      function updateAttendees() {
        const q = manualOrderState.quantity;
        while (manualOrderState.attendees.length < q) {
          manualOrderState.attendees.push({ full_name: '', email: '', phone: '' });
        }
        while (manualOrderState.attendees.length > q) {
          manualOrderState.attendees.pop();
        }
        manualOrderState.attendees.forEach((a, i) => {
          if (!a.full_name) a.full_name = manualOrderState.buyer.name || '';
          if (i === 0 && !a.email) a.email = manualOrderState.buyer.email || '';
        });
        renderAttendees();
      }

      function renderAttendees() {
        attendeesList.innerHTML = manualOrderState.attendees.map((a, i) => `
          <div class="form-group" style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:6px;">
            <input type="text" placeholder="Full name (ticket ${i+1})" data-idx="${i}" data-field="full_name" value="${a.full_name || ''}" required>
            <input type="email" placeholder="Email (optional)" data-idx="${i}" data-field="email" value="${a.email || ''}">
            <input type="tel" placeholder="Phone (optional)" data-idx="${i}" data-field="phone" value="${a.phone || ''}">
          </div>
        `).join('');
        attendeesList.querySelectorAll('input').forEach(el => {
          el.addEventListener('input', (e) => {
            const idx = parseInt(el.dataset.idx, 10);
            const field = el.dataset.field;
            manualOrderState.attendees[idx][field] = el.value;
          });
        });
      }

      function updateSummary() {
        const q = manualOrderState.quantity;
        const priceDollars = manualOrderState.pricePerTicketDollars;
        const subtotal = q * priceDollars;
        const taxRateBps = manualOrderState.event?.tax_rate_bps || 500;
        const tax = subtotal * (taxRateBps / 10000);
        const total = subtotal + tax;
        document.getElementById('mo-sum-subtotal').textContent = `$${subtotal.toFixed(2)}`;
        document.getElementById('mo-sum-tax').textContent = `$${tax.toFixed(2)}`;
        document.getElementById('mo-sum-total').textContent = `$${total.toFixed(2)}`;
      }

      eventSel.addEventListener('change', onEventChange);
      ttSel.addEventListener('change', onTicketTypeChange);
      qtyInput.addEventListener('input', onQuantityChange);
      priceInput.addEventListener('input', updatePriceHint);

      [['mo-buyer-name', 'name'], ['mo-buyer-email', 'email'], ['mo-buyer-phone', 'phone']].forEach(([id, field]) => {
        document.getElementById(id).addEventListener('input', (e) => {
          manualOrderState.buyer[field] = e.target.value;
          if (field === 'name' && manualOrderState.attendees[0]) {
            if (!manualOrderState.attendees[0].full_name ||
                manualOrderState.attendees[0].full_name === manualOrderState.buyer.name) {
              manualOrderState.attendees[0].full_name = e.target.value;
              renderAttendees();
            }
          }
          if (field === 'email' && manualOrderState.attendees[0]) {
            manualOrderState.attendees[0].email = e.target.value;
            renderAttendees();
          }
        });
      });

      updateAttendees();
      updateSummary();

      bindCustomerPicker();
      bindSubmit();
    }

    function bindCustomerPicker() {
      // Added in Task 9
    }

    function bindSubmit() {
      // Added in Task 10
    }

    // Load events for filter
    const { data: events } = await db.from('events').select('id, title, event_date, status, max_tickets_per_order, tax_rate_bps, mailerlite_group_id').order('event_date', { ascending: false });
    const eventSelect = document.getElementById('filter-event');
    (events || []).forEach(e => {
      const opt = document.createElement('option');
      opt.value = e.id;
      opt.textContent = `${e.title} (${e.event_date})`;
      eventSelect.appendChild(opt);
    });

    // Pre-select event from URL param
    const eventParam = getParam('event');
    if (eventParam) eventSelect.value = eventParam;

    let allOrders = [];

    async function loadOrders() {
      const container = document.getElementById('orders-list');
      const eventFilter = document.getElementById('filter-event').value;
      const statusFilter = document.getElementById('filter-status').value;
      const searchFilter = document.getElementById('filter-search').value.toLowerCase().trim();

      let query = db
        .from('orders')
        .select('*, events(title, slug)')
        .order('created_at', { ascending: false })
        .limit(200);

      if (eventFilter) query = query.eq('event_id', eventFilter);
      if (statusFilter) query = query.eq('payment_status', statusFilter);

      const { data: orders, error } = await query;

      if (error) {
        container.innerHTML = `<p class="form-error">${error.message}</p>`;
        return;
      }

      // Client-side search filter
      allOrders = (orders || []).filter(o => {
        if (!searchFilter) return true;
        return o.order_number.toLowerCase().includes(searchFilter) ||
               o.buyer_name.toLowerCase().includes(searchFilter) ||
               o.buyer_email.toLowerCase().includes(searchFilter);
      });

      // Update stats
      const completed = allOrders.filter(o => o.payment_status === 'completed');
      document.getElementById('stat-count').textContent = allOrders.length;
      document.getElementById('stat-revenue').textContent = formatPrice(completed.reduce((s, o) => s + o.total_cents, 0));
      document.getElementById('stat-tickets').textContent = completed.reduce((s, o) => s + o.quantity, 0);
      document.getElementById('stat-refunds').textContent = formatPrice(allOrders.reduce((s, o) => s + (o.refund_amount_cents || 0), 0));

      if (allOrders.length === 0) {
        container.innerHTML = '<p class="empty-state">No orders match your filters.</p>';
        return;
      }

      container.innerHTML = `
        <table class="admin-table">
          <thead>
            <tr>
              <th>Customer</th>
              <th class="hide-mobile">Event</th>
              <th>Qty</th>
              <th>Total</th>
              <th>Status</th>
              <th class="hide-mobile">Date</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            ${allOrders.map(o => `
              <tr>
                <td>${o.buyer_name}<br><small>${o.buyer_email}</small></td>
                <td class="hide-mobile">${o.events?.title || ''}</td>
                <td><a href="#" class="view-order" data-id="${o.id}">${o.quantity}</a></td>
                <td>${formatPrice(o.total_cents)}</td>
                <td><span class="status-badge status-${o.payment_status}">${o.payment_status}</span></td>
                <td class="hide-mobile"><small>${new Date(o.created_at).toLocaleDateString()}</small></td>
                <td>
                  <a href="#" class="btn-sm view-order" data-id="${o.id}">View</a>
                  <a href="#" class="btn-sm btn-delete delete-order" data-id="${o.id}" data-number="${o.order_number}">Delete</a>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;

      // Bind view order
      container.querySelectorAll('.view-order').forEach(link => {
        link.addEventListener('click', (e) => {
          e.preventDefault();
          viewOrder(link.dataset.id);
        });
      });

      // Bind delete
      container.querySelectorAll('.delete-order').forEach(link => {
        link.addEventListener('click', async (e) => {
          e.preventDefault();
          if (!confirm(`Delete order ${link.dataset.number}? This cannot be undone.`)) return;
          link.textContent = 'Deleting...';
          link.style.pointerEvents = 'none';

          const order = allOrders.find(o => o.id === link.dataset.id);

          // Decrement tickets_sold on event and ticket_type
          if (order) {
            const { data: evt } = await db.from('events').select('tickets_sold').eq('id', order.event_id).single();
            if (evt) {
              await db.from('events').update({
                tickets_sold: Math.max(evt.tickets_sold - order.quantity, 0)
              }).eq('id', order.event_id);
            }

            if (order.ticket_type_id) {
              const { data: tt } = await db.from('ticket_types').select('tickets_sold').eq('id', order.ticket_type_id).single();
              if (tt) {
                await db.from('ticket_types').update({
                  tickets_sold: Math.max(tt.tickets_sold - order.quantity, 0)
                }).eq('id', order.ticket_type_id);
              }
            }
          }

          // Delete attendees first (FK constraint), then the order
          await db.from('attendees').delete().eq('order_id', link.dataset.id);
          const { error } = await db.from('orders').delete().eq('id', link.dataset.id);

          if (error) {
            showToast('Delete failed: ' + error.message, 'error');
            link.textContent = 'Delete';
            link.style.pointerEvents = '';
          } else {
            showToast('Order deleted.', 'success');
            loadOrders();
          }
        });
      });
    }

    async function viewOrder(orderId) {
      const order = allOrders.find(o => o.id === orderId);
      if (!order) return;

      // Fetch attendees
      const { data: attendees } = await db
        .from('attendees')
        .select('*')
        .eq('order_id', orderId);

      const modal = document.getElementById('order-modal');
      const modalBody = document.getElementById('modal-body');
      document.getElementById('modal-title').textContent = `Order ${order.order_number}`;

      modalBody.innerHTML = `
        <div class="detail-grid" style="margin-bottom:20px;">
          <div class="detail-item"><span class="detail-label">Customer</span><span class="detail-value">${order.buyer_name}</span></div>
          <div class="detail-item"><span class="detail-label">Email</span><span class="detail-value">${order.buyer_email}</span></div>
          <div class="detail-item"><span class="detail-label">Phone</span><span class="detail-value">${order.buyer_phone || 'N/A'}</span></div>
          <div class="detail-item"><span class="detail-label">Event</span><span class="detail-value">${order.events?.title || ''}</span></div>
          <div class="detail-item"><span class="detail-label">Quantity</span><span class="detail-value">${order.quantity}</span></div>
          <div class="detail-item"><span class="detail-label">Status</span><span class="detail-value"><span class="status-badge status-${order.payment_status}">${order.payment_status}</span></span></div>
          <div class="detail-item"><span class="detail-label">Subtotal</span><span class="detail-value">${formatPrice(order.subtotal_cents || order.total_cents)}</span></div>
          <div class="detail-item"><span class="detail-label">Discount</span><span class="detail-value">${formatPrice(order.discount_cents || 0)}</span></div>
          <div class="detail-item"><span class="detail-label">Tax</span><span class="detail-value">${formatPrice(order.tax_cents || 0)}</span></div>
          <div class="detail-item"><span class="detail-label">Total</span><span class="detail-value"><strong>${formatPrice(order.total_cents)}</strong></span></div>
          <div class="detail-item"><span class="detail-label">Stripe ID</span><span class="detail-value" style="font-size:0.8rem;">${order.stripe_payment_id || 'N/A'}</span></div>
          <div class="detail-item"><span class="detail-label">Created</span><span class="detail-value">${new Date(order.created_at).toLocaleString()}</span></div>
        </div>
        ${attendees && attendees.length > 0 ? `
          <h4 style="margin-bottom:12px;">Attendees</h4>
          <table class="admin-table" style="font-size:0.8rem;">
            <thead><tr><th>Name</th><th>Email</th><th>QR Code</th><th>Checked In</th></tr></thead>
            <tbody>
              ${attendees.map(a => `
                <tr>
                  <td>${a.full_name}</td>
                  <td>${a.email || ''}</td>
                  <td style="font-family:monospace;font-size:0.7rem;">${a.qr_code ? a.qr_code.substring(0, 12) + '...' : 'N/A'}</td>
                  <td>${a.checked_in ? 'Yes' : 'No'}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        ` : '<p class="empty-state">No attendees recorded.</p>'}
      `;

      modal.style.display = 'flex';
    }

    // Close modal
    document.getElementById('modal-close').addEventListener('click', () => {
      document.getElementById('order-modal').style.display = 'none';
    });
    document.getElementById('order-modal').addEventListener('click', (e) => {
      if (e.target === e.currentTarget) e.currentTarget.style.display = 'none';
    });

    // Filter handlers
    document.getElementById('filter-btn').addEventListener('click', loadOrders);
    document.getElementById('filter-search').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') loadOrders();
    });

    // Export CSV
    document.getElementById('export-csv').addEventListener('click', () => {
      if (allOrders.length === 0) return;
      const headers = ['Order #', 'Customer', 'Email', 'Phone', 'Event', 'Qty', 'Subtotal', 'Discount', 'Tax', 'Total', 'Status', 'Date'];
      const rows = allOrders.map(o => [
        o.order_number, o.buyer_name, o.buyer_email, o.buyer_phone || '',
        o.events?.title || '', o.quantity,
        (o.subtotal_cents / 100).toFixed(2), ((o.discount_cents || 0) / 100).toFixed(2),
        ((o.tax_cents || 0) / 100).toFixed(2), (o.total_cents / 100).toFixed(2),
        o.payment_status, new Date(o.created_at).toLocaleDateString()
      ]);
      const csv = [headers, ...rows].map(r => r.map(c => `"${c}"`).join(',')).join('\n');
      const blob = new Blob([csv], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = 'orders.csv';
      link.click();
      URL.revokeObjectURL(url);
    });

    loadOrders();

    // Mobile sidebar toggle
    const menuBtn = document.getElementById('admin-menu-toggle');
    const sidebar = document.getElementById('admin-sidebar');
    const overlay = document.getElementById('sidebar-overlay');
    if (menuBtn) {
      menuBtn.addEventListener('click', () => {
        sidebar.classList.toggle('open');
        overlay.classList.toggle('open');
      });
      overlay.addEventListener('click', () => {
        sidebar.classList.remove('open');
        overlay.classList.remove('open');
      });
    }
  </script>
</body>
</html>
